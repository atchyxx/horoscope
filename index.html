<div class="container">
  <header>
    <h1>🔭 占星ホロスコープ表</h1>

<script>

const RULERS = ["火星","金星","水星","月","太陽","水星","金星","冥王星","木星","土星","天王星","海王星"];
const RULER_SUB = {
  "火星":"勇気とエネルギーの星","金星":"愛と美の星","水星":"知性とコミュニケーションの星",
  "月":"感情と直感の星","太陽":"生命力と自己表現の星","冥王星":"変容と再生の星",
  "木星":"拡大と幸運の星","土星":"試練と努力の星","天王星":"革新と自由の星","海王星":"夢と想像力の星"
};
const PHASES = [
  { name: "新月", emoji: "🌑", sub: "月齢 0〜3.7 頃" },
  { name: "三日月（上弦へ）", emoji: "🌒", sub: "月齢 3.7〜7.4 頃" },
  { name: "上弦の月", emoji: "🌓", sub: "月齢 7.4〜11.1 頃" },
  { name: "満月に近づく月", emoji: "🌔", sub: "月齢 11.1〜14.8 頃" },
  { name: "満月", emoji: "🌕", sub: "月齢 14.8〜18.4 頃" },
  { name: "欠けていく月", emoji: "🌖", sub: "月齢 18.4〜22.1 頃" },
  { name: "下弦の月", emoji: "🌗", sub: "月齢 22.1〜25.8 頃" },
  { name: "新月に近づく月", emoji: "🌘", sub: "月齢 25.8〜29.5 頃" }
];
const SYNODIC = 29.53058867;
const NEW_MOON_EPOCH = Date.UTC(2000, 0, 6, 18, 14); // 2000-01-06 18:14 UTC 新月

function rev(x) { return x - Math.floor(x / 360) * 360; }
function sinD(x) { return Math.sin(x * DEG); }
function cosD(x) { return Math.cos(x * DEG); }

// 月齢
function moonAge(date) {
  const days = (date.getTime() - NEW_MOON_EPOCH) / 86400000;
  return ((days % SYNODIC) + SYNODIC) % SYNODIC;
}
function phaseOf(date) {
  const age = moonAge(date);
  const idx = Math.min(7, Math.floor(age / (SYNODIC / 8)));
  return { ...PHASES[idx], age };
}

// 2000 Jan 0.0 (JD 2451543.5) からの日数
function dayNumber(date) {
  return date.getTime() / 86400000 - 10956.0; // 2451543.5 - 2440587.5
}

// 離心近点角の反復解法
function eccAnomaly(M, e) {
  let E = M + (e * 180 / Math.PI) * sinD(M) * (1 + e * cosD(M));
  for (let i = 0; i < 6; i++) {
    E = E - (E - (e * 180 / Math.PI) * sinD(E) - M) / (1 - e * cosD(E));
  }
  return E;
}

// 軌道要素から日心黄道座標経度（惑星）、地心に変換
function planetHelio(d, el) {
  const N = el.N[0] + el.N[1] * d;
  const i = el.i[0] + el.i[1] * d;
  const w = el.w[0] + el.w[1] * d;
  const a = el.a[0];
  const e = el.e[0] + el.e[1] * d;
  const M = rev(el.M[0] + el.M[1] * d);
  const E = eccAnomaly(M, e);
  const xv = a * (cosD(E) - e);
  const yv = a * Math.sqrt(1 - e * e) * sinD(E);
  const v = rev(Math.atan2(yv, xv) / DEG);
  const r = Math.sqrt(xv * xv + yv * yv);
  const xh = r * (cosD(N) * cosD(v + w) - sinD(N) * sinD(v + w) * cosD(i));
  const yh = r * (sinD(N) * cosD(v + w) + cosD(N) * sinD(v + w) * cosD(i));
  return { xh, yh, M, w, v, r, N };
}

const ELEMENTS_TABLE = {
  mercury: { N:[48.3313,3.24587e-5], i:[7.0047,5.00e-8], w:[29.1241,1.01444e-5], a:[0.387098,0], e:[0.205635,5.59e-10], M:[168.6562,4.0923344368] },
  venus:   { N:[76.6799,2.46590e-5], i:[3.3946,2.75e-8], w:[54.8910,1.38374e-5], a:[0.723330,0], e:[0.006773,-1.302e-9], M:[48.0052,1.6021302244] },
  mars:    { N:[49.5574,2.11081e-5], i:[1.8497,-1.78e-8], w:[286.5016,2.92961e-5], a:[1.523688,0], e:[0.093405,2.516e-9], M:[18.6021,0.5240207766] },
  jupiter: { N:[100.4542,2.76854e-5], i:[1.3030,-1.557e-7], w:[273.8777,1.64505e-5], a:[5.20256,0], e:[0.048498,4.469e-9], M:[19.8950,0.0830853001] },

};

// 太陽の黄経（地心）と日心座標の基準
function sunPos(d) {
  const w = 282.9404 + 4.70935e-5 * d;
  const e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.0470 + 0.9856002585 * d);
  const E = eccAnomaly(M, e);
  const xv = cosD(E) - e;
  const yv = Math.sqrt(1 - e * e) * sinD(E);
  const v = rev(Math.atan2(yv, xv) / DEG);
  const r = Math.sqrt(xv * xv + yv * yv);
  return { lon: rev(v + w), xs: r * cosD(v + w), ys: r * sinD(v + w), M, r };
}

// 月の黄経（主要摂動項つき）
function moonLon(d, sun) {
  const N = rev(125.1228 - 0.0529538083 * d);
  const i = 5.1454;
  const w = rev(318.0634 + 0.1643573223 * d);
  const e = 0.054900;
  const Mm = rev(115.3654 + 13.0649929509 * d);
  const E = eccAnomaly(Mm, e);
  const xv = cosD(E) - e;
  const yv = Math.sqrt(1 - e * e) * sinD(E);
  const v = rev(Math.atan2(yv, xv) / DEG);
  const r = Math.sqrt(xv * xv + yv * yv);
  const xh = r * (cosD(N) * cosD(v + w) - sinD(N) * sinD(v + w) * cosD(i));
  const yh = r * (sinD(N) * cosD(v + w) + cosD(N) * sinD(v + w) * cosD(i));
  let lon = rev(Math.atan2(yh, xh) / DEG);
  const Ms = sun.M;
  const Lm = rev(N + w + Mm);      // 月の平均黄経
  const Dm = rev(Lm - sun.lon);    // 平均離角
  const F = rev(Lm - N);
  lon += -1.274 * sinD(Mm - 2 * Dm)
       + 0.658 * sinD(2 * Dm)
       - 0.186 * sinD(Ms)
       - 0.059 * sinD(2 * Mm - 2 * Dm)
       - 0.057 * sinD(Mm - 2 * Dm + Ms)
       + 0.053 * sinD(Mm + 2 * Dm)
       + 0.046 * sinD(2 * Dm - Ms)
       + 0.041 * sinD(Mm - Ms)
       - 0.035 * sinD(Dm)
       - 0.031 * sinD(Mm + Ms)
       - 0.015 * sinD(2 * F - 2 * Dm)
       + 0.011 * sinD(Mm - 4 * Dm);
  return rev(lon);
}

function geocentricLon(d, el, sun) {
  const p = planetHelio(d, el);
  const xg = p.xh + sun.xs;
  const yg = p.yh + sun.ys;
  return rev(Math.atan2(yg, xg) / DEG);
}

function signOf(lon) { return Math.floor(rev(lon) / 30) % 12; }
function fmtLon(lon) {
  const l = rev(lon);
  const s = Math.floor(l / 30);
  const deg = l - s * 30;
  return `${SIGN_GLYPH[s]} ${SIGNS[s]} ${deg.toFixed(1)}°`;
}

// 運勢の決定的乱数（日付×星座×分野で固定）
function hashRand(seedStr) {
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

// エレメント間の相性: 火↔風=好調、地↔水=好調、同じ=same、対立(火↔水, 地↔風)=tension
function elementRelation(a, b) {
  if (a === b) return "same";
  const pair = [a, b].sort().join("");
  if (pair === "火風" || pair === "地水") return "harmony";
  if (pair === "火水" || pair === "地風") return "tension";
  return "neutral";
}

const WDAYS = ["日","月","火","水","木","金","土"];
function dateLabel(dt) { return `${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日`; }
function dateKeyOf(dt) { return `${dt.getFullYear()}-${dt.getMonth() + 1}-${dt.getDate()}`; }
function toUTCNoon(y, m, d) { return new Date(Date.UTC(y, m - 1, d, 12)); }
function localNoon(dt) { return toUTCNoon(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); }

// 逆行判定（地心黄経が1日で減少していれば逆行）
function isRetrograde(el, d) {
  const a = geocentricLon(d, el, sunPos(d));
  const b = geocentricLon(d + 1, el, sunPos(d + 1));
  return rev(b - a) > 180;
}

// 指定日の運勢を一括計算
function computeDay(target, sIdx) {
  const elem = ELEMENTS[sIdx % 4];
  const d = dayNumber(target);
  const sun = sunPos(d);
  const phase = phaseOf(target);
  const mLon = moonLon(d, sun);
  const moonSignIdx = signOf(mLon);
  const moonElem = ELEMENTS[moonSignIdx % 4];
  const relation = elementRelation(elem, moonElem);
  const bonus = relation === "same" ? 1 : relation === "harmony" ? 0.5 : relation === "tension" ? -0.5 : 0;
  const venusLon = geocentricLon(d, ELEMENTS_TABLE.venus, sun);
  const marsLon = geocentricLon(d, ELEMENTS_TABLE.mars, sun);
  const retro = {
    mercury: isRetrograde(ELEMENTS_TABLE.mercury, d),
    venus: isRetrograde(ELEMENTS_TABLE.venus, d),
    mars: isRetrograde(ELEMENTS_TABLE.mars, d),
    jupiter: isRetrograde(ELEMENTS_TABLE.jupiter, d),
    saturn: isRetrograde(ELEMENTS_TABLE.saturn, d)
  };
  const dateKey = dateKeyOf(target);
  const scores = {};
  CATEGORIES.forEach((cat) => {
    scores[cat] = Math.max(1, Math.min(5, Math.round(1 + hashRand(`${dateKey}:${sIdx}:${cat}`) * 4 + bonus)));
  });
  const total = CATEGORIES.reduce((sum, c) => sum + scores[c], 0);
  return { d, sun, phase, moonSignIdx, moonElem, relation, scores, total, dateKey, venusLon, marsLon, retro };
}

     <div style="margin-bottom:8px;">📌 <b>この日の過ごし方</b>：最も運気が高いのは<b>${best}</b>。ここに時間とエネルギーを優先的に使いましょう。一方、<b>${worst}</b>は低調気味なので、重要な判断は別の日に回すと吉です。</div>
     <div style="margin-bottom:8px; padding:10px 12px; background:var(--cp-surface-soft); border:1px solid var(--cp-border); border-radius:0.625rem;">🌟 <b>星の動きからのアドバイス</b><div style="margin-top:6px;">${motionHtml}</div></div>
     <div>🎨 ラッキーカラー：<b>${luckyColor}</b>　🍀 アイテム：<b>${luckyItem}</b>　🔢 ナンバー：<b>${luckyNum}</b>　🧭 方角：<b>${luckyDir}</b>　⏰ 時間帯：<b>${luckyTime}</b></div>`;
}

// --- 週間モード ---
function renderWeek(start, sIdx) {
  const days = [];
  for (let i = 0; i < 7; i++) {
    const t = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    days.push({ date: t, ...computeDay(localNoon(t), sIdx) });
  }
  const end = days[6].date;
  document.getElementById("weekRange").textContent =
    `${days[0].date.getMonth() + 1}/${days[0].date.getDate()} 〜 ${end.getMonth() + 1}/${end.getDate()}`;

  let bestIdx = 0;
  days.forEach((dy, i) => { if (dy.total > days[bestIdx].total) bestIdx = i; });

  document.getElementById("weekTable").innerHTML = days.map((dy, i) => {
    const dt = dy.date;
    const overall = Math.round(dy.total / 4);
    const stars = "★".repeat(overall) + "☆".repeat(5 - overall);
    const bestCat = CATEGORIES.reduce((a, b) => dy.scores[a] >= dy.scores[b] ? a : b);
    const comment = dy.total >= 17 ? `${bestCat.replace("運", "")}が絶好調`
      : dy.total >= 14 ? `${bestCat}が好調`
      : dy.total >= 11 ? "安定した一日"
      : "休息を優先する日";
    const hl = i === bestIdx ? ` style="background:var(--cp-highlight);"` : "";
    const cells = CATEGORIES.map((c) => `<td>${dy.scores[c]}</td>`).join("");
    return `<tr${hl}><td>${dt.getMonth() + 1}/${dt.getDate()}（${WDAYS[dt.getDay()]}）</td>
      <td title="${dy.phase.name}">${dy.phase.emoji}</td>
      <td style="font-size:0.82rem;">${SIGN_GLYPH[dy.moonSignIdx]} ${SIGNS[dy.moonSignIdx]}</td>
      <td><span class="stars" style="font-size:0.85rem;">${stars}</span></td>
      ${cells}<td style="font-size:0.82rem;">${comment}</td></tr>`;
  }).join("");

  const bd = days[bestIdx];
  const bdt = bd.date;
  const bBest = CATEGORIES.reduce((a, b) => bd.scores[a] >= bd.scores[b] ? a : b);
  const fullMoons = days.filter((dy) => dy.phase.age >= 14.0 && dy.phase.age <= 15.5);
  const newMoons = days.filter((dy) => dy.phase.age <= 1.0 || dy.phase.age >= 28.5);
  let phaseNote = "";
  if (fullMoons.length) phaseNote = `🌕 ${fullMoons[0].date.getMonth() + 1}/${fullMoons[0].date.getDate()} 頃が満月。成果の確認や感謝の機会に。`;
  else if (newMoons.length) phaseNote = `🌑 ${newMoons[0].date.getMonth() + 1}/${newMoons[0].date.getDate()} 頃が新月。新しいことを始めるのに最適です。`;
  const retroDays = days.filter((dy) => dy.retro.mercury).length;
  const retroNote = retroDays === 7
    ? "⏪ この週は水星が逆行中。連絡・交通・契約まわりの見直しを丁寧に。"
    : retroDays > 0 ? "⏪ 週の途中で水星の逆行/順行が切り替わります。節目の日は確認作業を丁寧に。" : "";
  const moonChanges = [];
  for (let i = 1; i < days.length; i++) {
    if (days[i].moonSignIdx !== days[i - 1].moonSignIdx) {
      moonChanges.push(`${days[i].date.getMonth() + 1}/${days[i].date.getDate()}頃に月が${SIGNS[days[i].moonSignIdx]}へ`);
    }
  }
  document.getElementById("weekMessage").innerHTML =
    `<div style="margin-bottom:8px;">🏆 <b>今週のベストデー</b>：<b>${bdt.getMonth() + 1}/${bdt.getDate()}（${WDAYS[bdt.getDay()]}）</b>。特に<b>${bBest}</b>の運気が高い日です。大事な約束や勝負事はこの日に。</div>
     ${phaseNote ? `<div style="margin-bottom:8px;">${phaseNote}</div>` : ""}
     ${moonChanges.length ? `<div style="margin-bottom:8px;">🌙 <b>月の移動</b>：${moonChanges.join("、")}。星座が変わるタイミングで気分や空気が切り替わります。</div>` : ""}
     ${retroNote ? `<div>${retroNote}</div>` : ""}`;
}

document.getElementById("btn").addEventListener("click", () => {
  const v = document.getElementById("birthdate").value;
  if (!v) { document.getElementById("birthdate").focus(); return; }
  const [y, m, d] = v.split("-").map(Number);
  const tv = document.getElementById("targetdate").value;
  let target;
  if (tv) {
    const [ty, tm, td] = tv.split("-").map(Number);
    target = new Date(ty, tm - 1, td);
  } else {
    const now = new Date();
    target = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  }
  const mode = document.getElementById("mode").value;
  render(toUTCNoon(y, m, d), target, mode);
});
["birthdate", "targetdate"].forEach((id) => {
  document.getElementById(id).addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("btn").click();
  });
});
// 占う日の初期値は今日
(() => {
  const now = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  document.getElementById("targetdate").value =
    `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
})();
</script>
</body>
</html>
