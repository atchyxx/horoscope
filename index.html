<script>

  "木星":"拡大と幸運の星","土星":"試練と努力の星","天王星":"革新と自由の星","海王星":"夢と想像力の星"
};
const PHASES = [
  { name: "新月", emoji: "🌑", sub: "月齢 0〜3.7 頃" },
  { name: "三日月（上弦へ）", emoji: "🌒", sub: "月齢 3.7〜7.4 頃" },
  { name: "上弦の月", emoji: "🌓", sub: "月齢 7.4〜11.1 頃" },
  { name: "満月に近づく月", emoji: "🌔", sub: "月齢 11.1〜14.8 頃" },
  { name: "満月", emoji: "🌕", sub: "月齢 14.8〜18.4 頃" },
  { name: "欠けていく月", emoji: "🌖", sub: "月齢 18.4〜22.1 頃" },
  { name: "下弦の月", emoji: "🌗", sub: "月齢 22.1〜25.8 頃" },
  { name: "新月に近づく月", emoji: "🌘", sub: "月齢 25.8〜29.5 頃" }
];
const SYNODIC = 29.53058867;
const NEW_MOON_EPOCH = Date.UTC(2000, 0, 6, 18, 14); // 2000-01-06 18:14 UTC 新月

function rev(x) { return x - Math.floor(x / 360) * 360; }
function sinD(x) { return Math.sin(x * DEG); }
function cosD(x) { return Math.cos(x * DEG); }

// 月齢
function moonAge(date) {
  const days = (date.getTime() - NEW_MOON_EPOCH) / 86400000;
  return ((days % SYNODIC) + SYNODIC) % SYNODIC;
}
function phaseOf(date) {
  const age = moonAge(date);
  const idx = Math.min(7, Math.floor(age / (SYNODIC / 8)));
  return { ...PHASES[idx], age };
}

// 2000 Jan 0.0 (JD 2451543.5) からの日数
function dayNumber(date) {
  return date.getTime() / 86400000 - 10956.0; // 2451543.5 - 2440587.5
}

// 離心近点角の反復解法
function eccAnomaly(M, e) {
  let E = M + (e * 180 / Math.PI) * sinD(M) * (1 + e * cosD(M));
  for (let i = 0; i < 6; i++) {
    E = E - (E - (e * 180 / Math.PI) * sinD(E) - M) / (1 - e * cosD(E));
  }
  return E;
}

// 軌道要素から日心黄道座標経度（惑星）、地心に変換
function planetHelio(d, el) {
  const N = el.N[0] + el.N[1] * d;
  const i = el.i[0] + el.i[1] * d;
  const w = el.w[0] + el.w[1] * d;
  const a = el.a[0];
  const e = el.e[0] + el.e[1] * d;
  const M = rev(el.M[0] + el.M[1] * d);
  const E = eccAnomaly(M, e);
  const xv = a * (cosD(E) - e);
  const yv = a * Math.sqrt(1 - e * e) * sinD(E);
  const v = rev(Math.atan2(yv, xv) / DEG);
  const r = Math.sqrt(xv * xv + yv * yv);
  const xh = r * (cosD(N) * cosD(v + w) - sinD(N) * sinD(v + w) * cosD(i));
  const yh = r * (sinD(N) * cosD(v + w) + cosD(N) * sinD(v + w) * cosD(i));
  return { xh, yh, M, w, v, r, N };
}

const ELEMENTS_TABLE = {

// 太陽の黄経（地心）と日心座標の基準
function sunPos(d) {
  const w = 282.9404 + 4.70935e-5 * d;
  const e = 0.016709 - 1.151e-9 * d;
  const M = rev(356.0470 + 0.9856002585 * d);
  const E = eccAnomaly(M, e);
  const xv = cosD(E) - e;
  const yv = Math.sqrt(1 - e * e) * sinD(E);
  const v = rev(Math.atan2(yv, xv) / DEG);
  const r = Math.sqrt(xv * xv + yv * yv);
  return { lon: rev(v + w), xs: r * cosD(v + w), ys: r * sinD(v + w), M, r };
}

// 月の黄経（主要摂動項つき）
function moonLon(d, sun) {
  const N = rev(125.1228 - 0.0529538083 * d);
  const i = 5.1454;
  const w = rev(318.0634 + 0.1643573223 * d);
  const e = 0.054900;
  const Mm = rev(115.3654 + 13.0649929509 * d);
  const E = eccAnomaly(Mm, e);
  const xv = cosD(E) - e;
  const yv = Math.sqrt(1 - e * e) * sinD(E);
  const v = rev(Math.atan2(yv, xv) / DEG);
  const r = Math.sqrt(xv * xv + yv * yv);
  const xh = r * (cosD(N) * cosD(v + w) - sinD(N) * sinD(v + w) * cosD(i));
  const yh = r * (sinD(N) * cosD(v + w) + cosD(N) * sinD(v + w) * cosD(i));
  let lon = rev(Math.atan2(yh, xh) / DEG);
  const Ms = sun.M;
  const Lm = rev(N + w + Mm);      // 月の平均黄経
  const Dm = rev(Lm - sun.lon);    // 平均離角
  const F = rev(Lm - N);
  lon += -1.274 * sinD(Mm - 2 * Dm)
       + 0.658 * sinD(2 * Dm)
       - 0.186 * sinD(Ms)
       - 0.059 * sinD(2 * Mm - 2 * Dm)
       - 0.057 * sinD(Mm - 2 * Dm + Ms)
       + 0.053 * sinD(Mm + 2 * Dm)
       + 0.046 * sinD(2 * Dm - Ms)
       + 0.041 * sinD(Mm - Ms)
       - 0.035 * sinD(Dm)
       - 0.031 * sinD(Mm + Ms)
       - 0.015 * sinD(2 * F - 2 * Dm)
       + 0.011 * sinD(Mm - 4 * Dm);
  return rev(lon);
}

function geocentricLon(d, el, sun) {
  const p = planetHelio(d, el);
  const xg = p.xh + sun.xs;
  const yg = p.yh + sun.ys;
  return rev(Math.atan2(yg, xg) / DEG);
}

function signOf(lon) { return Math.floor(rev(lon) / 30) % 12; }
function fmtLon(lon) {
  const l = rev(lon);
  const s = Math.floor(l / 30);
  const deg = l - s * 30;
  return `${SIGN_GLYPH[s]} ${SIGNS[s]} ${deg.toFixed(1)}°`;
}

// 運勢の決定的乱数（日付×星座×分野で固定）
function hashRand(seedStr) {
  let h = 2166136261;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  h = Math.imul(h ^ (h >>> 13), 0x5bd1e995);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}

    ]
  },
  "金運": {

    ],
    low: [
      "大きな買い物・投資は控えめに。今日は情報収集に留めるのが賢明です。",
      "貸し借りはNG。頼まれても丁寧に断る勇気があなたを守ります。",
      "忘れ物・落とし物に注意。貴重品はいつもと同じ場所に定位置管理を。",
      "節約よりも「無駄を減らす」意識で。今日はコンビニ寄らずに帰りましょう。"
    ]
  },
  "健康運": {
    high: [
      "体力気力ともに充実。新しい運動（散歩・ストレッチ）を始めるのに最適な日。",
      "体の声が聞こえる日。旬の食べ物を取り入れると体調がさらに整います。",
      "早寝早起きのリズム作りを今日から。3日続ければ習慣化します。",
      "アクティブに動くと運気上昇。駅一つ分歩くだけでも効果あり。"
    ],
    mid: [
      "無理せずマイペースで。こまめな水分補給を意識すると1日快調です。",

    ],
    low: [
      "疲労が溜まっています。今日は予定を詰め込まず、早めの帰宅を。",

const COMPAT_MSG = {
  same: "今日の月はあなたと同じ「{elem}」のエレメント。感覚が研ぎ澄まされ、物事がスムーズに進む追い風の日です。",
  harmony: "今日の月はあなたと相性の良いエレメント。人間関係や直感に恵まれ、心地よく過ごせます。",
  neutral: "今日の月はあなたにとって中立の位置。大きな波はなく、自分のペースを保てる安定した日です。",
  tension: "今日の月はあなたと反対のエレメント。いつもと違う視点が得られる日。違和感は学びのチャンスです。"
};
// エレメント間の相性: 火↔風=好調、地↔水=好調、同じ=same、対立(火↔水, 地↔風)=tension
function elementRelation(a, b) {
  if (a === b) return "same";
  const pair = [a, b].sort().join("");
  if (pair === "火風" || pair === "地水") return "harmony";
  if (pair === "火水" || pair === "地風") return "tension";
  return "neutral";
}
const PHASE_MSG = {
  0: "新月は始まりのとき。新しい目標を立てると願いが叶いやすい日です。",
  1: "月が満ち始める時期。小さな一歩を踏み出すのに適しています。",
  2: "上弦の月は行動と決断のとき。迷っていることに答えを出しましょう。",
  3: "達成に向けて追い込みをかける好機。粘り強さが実を結びます。",
  4: "満月は完成と感謝のとき。成果を振り返り、周囲へ感謝を伝えましょう。",
  5: "手放しと整理の時期。不要なものを処分すると運気が整います。",
  6: "下弦の月は内省のとき。無理をせず休息を取りましょう。",
  7: "次の新月に備え心身を浄化する時期。瞑想や読書がおすすめです。"
};

function render(birth) {
  const today = new Date();
  document.getElementById("todayStr").textContent =
    `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;

  // 太陽星座（誕生日）
  const dBirth = dayNumber(birth);
  const sunBirth = sunPos(dBirth);
  const sIdx = signOf(sunBirth.lon);
  const elem = ELEMENTS[sIdx % 4];
  const ruler = RULERS[sIdx];
  document.getElementById("sunSign").textContent = `${SIGN_GLYPH[sIdx]} ${SIGNS[sIdx]}`;
  document.getElementById("sunSignSub").textContent = fmtLon(sunBirth.lon);
  document.getElementById("element").textContent = `${elem}のエレメント`;
  document.getElementById("elementSub").textContent = ELEMENT_SUB[elem];
  document.getElementById("ruler").textContent = ruler;
  document.getElementById("rulerSub").textContent = RULER_SUB[ruler];

  // 誕生日の月
  const bp = phaseOf(birth);
  document.getElementById("birthMoonEmoji").textContent = bp.emoji;
  document.getElementById("birthMoonPhase").textContent = bp.name;
  document.getElementById("birthMoonSub").textContent = `月齢 ${bp.age.toFixed(1)}`;

  // 今日の月
  const tp = phaseOf(today);
  document.getElementById("todayMoonEmoji").textContent = tp.emoji;
  document.getElementById("todayMoonPhase").textContent = tp.name;
  document.getElementById("todayMoonSub").textContent = `月齢 ${tp.age.toFixed(1)} ／ ${tp.sub}`;

  // 惑星表
  const dToday = dayNumber(today);
  const sunToday = sunPos(dToday);
  const rows = [];
  rows.push(["☉ 太陽", sunToday.lon]);
  rows.push(["☽ 月", moonLon(dToday, sunToday)]);
  rows.push(["☿ 水星", geocentricLon(dToday, ELEMENTS_TABLE.mercury, sunToday)]);
  rows.push(["♀ 金星", geocentricLon(dToday, ELEMENTS_TABLE.venus, sunToday)]);
  rows.push(["♂ 火星", geocentricLon(dToday, ELEMENTS_TABLE.mars, sunToday)]);
  rows.push(["♃ 木星", geocentricLon(dToday, ELEMENTS_TABLE.jupiter, sunToday)]);
  rows.push(["♄ 土星", geocentricLon(dToday, ELEMENTS_TABLE.saturn, sunToday)]);
  document.getElementById("planetTable").innerHTML = rows.map(([name, lon]) =>
    `<tr><td>${name}</td><td>${SIGNS[signOf(lon)]}</td><td>${fmtLon(lon)}</td></tr>`
  ).join("");

  // 運勢
  document.getElementById("fortuneSign").textContent = SIGNS[sIdx];
  const dateKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;

  // 今日の月の星座とエレメント相性（運気ボーナスに反映）
  const todayMoonLon = moonLon(dToday, sunToday);
  const moonSignIdx = signOf(todayMoonLon);
  const moonElem = ELEMENTS[moonSignIdx % 4];
  const relation = elementRelation(elem, moonElem);
  const bonus = relation === "same" ? 1 : relation === "harmony" ? 0.5 : relation === "tension" ? -0.5 : 0;

  const container = document.getElementById("luckRows");
  container.innerHTML = "";
  const scores = {};
  CATEGORIES.forEach((cat) => {
    const score = Math.max(1, Math.min(5, Math.round(1 + hashRand(`${dateKey}:${sIdx}:${cat}`) * 4 + bonus)));
    scores[cat] = score;
    const stars = "★".repeat(score) + "☆".repeat(5 - score);
    const level = score >= 4 ? "high" : score === 3 ? "mid" : "low";
    const pool = ADVICE[cat][level];
    const advice = pool[Math.floor(hashRand(`${dateKey}:${sIdx}:${cat}:adv`) * pool.length)];
    const row = document.createElement("div");
    row.className = "luck-block";
    row.innerHTML = `<div class="luck-row"><span class="cat">${cat}</span><span class="stars">${stars}</span>
      <div class="bar-wrap"><div class="bar" style="width:${score * 20}%"></div></div></div>
      <div class="advice">${advice}</div>`;
    container.appendChild(row);
  });

  // ラッキー要素
  const luckyColor = LUCKY_COLORS[Math.floor(hashRand(`${dateKey}:${sIdx}:color`) * LUCKY_COLORS.length)];
  const luckyItem = LUCKY_ITEMS[Math.floor(hashRand(`${dateKey}:${sIdx}:item`) * LUCKY_ITEMS.length)];
  const luckyNum = 1 + Math.floor(hashRand(`${dateKey}:${sIdx}:num`) * 99);
  const luckyDir = LUCKY_DIRS[Math.floor(hashRand(`${dateKey}:${sIdx}:dir`) * LUCKY_DIRS.length)];
  const luckyTime = LUCKY_TIMES[Math.floor(hashRand(`${dateKey}:${sIdx}:time`) * LUCKY_TIMES.length)];

  // 総合アドバイス（月相 × エレメント相性 × 最強/最弱分野）
  const phaseMsg = PHASE_MSG[Math.min(7, Math.floor(tp.age / (SYNODIC / 8)))];
  const compatMsg = COMPAT_MSG[relation].replace("{elem}", moonElem);
  const best = CATEGORIES.reduce((a, b) => scores[a] >= scores[b] ? a : b);
  const worst = CATEGORIES.reduce((a, b) => scores[a] <= scores[b] ? a : b);
  document.getElementById("message").innerHTML =
    `<div style="margin-bottom:8px;">🌙 <b>月相からの示唆</b>：${phaseMsg}</div>
     <div style="margin-bottom:8px;">🪐 <b>今日の月（${SIGNS[moonSignIdx]}）との相性</b>：${compatMsg}</div>
     <div style="margin-bottom:8px;">📌 <b>今日の過ごし方</b>：最も運気が高いのは<b>${best}</b>。ここに時間とエネルギーを優先的に使いましょう。一方、<b>${worst}</b>は低調気味なので、重要な判断は明日以降に回すと吉です。</div>
     <div>🎨 ラッキーカラー：<b>${luckyColor}</b>　🍀 アイテム：<b>${luckyItem}</b>　🔢 ナンバー：<b>${luckyNum}</b>　🧭 方角：<b>${luckyDir}</b>　⏰ 時間帯：<b>${luckyTime}</b></div>`;

  document.getElementById("result").classList.remove("hidden");
}

document.getElementById("btn").addEventListener("click", () => {
  const v = document.getElementById("birthdate").value;
  if (!v) { document.getElementById("birthdate").focus(); return; }
  const [y, m, d] = v.split("-").map(Number);
  render(new Date(Date.UTC(y, m - 1, d, 12)));
});
document.getElementById("birthdate").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("btn").click();
});
</script>
